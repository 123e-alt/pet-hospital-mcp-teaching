[LLM]
; 复制本文件为 config.ini 后填写真实值（config.ini 已被 .gitignore 忽略，不会提交到 GitHub）
api_key = sk-your-api-key-here
base_url = https://api.deepseek.com
model_name = deepseek-chat
; 可选：模型上下文窗口（tokens）。留空/0 = 未知，按默认 128k 监控并在界面标注「默认」
; context_window = 131072

[APP]
; 可选：Agent 文件操作的根目录，留空则使用启动时的工作目录
workspace =
; 单轮对话中允许的最大工具调用轮数
max_tool_rounds = 16

[search]
; 可选：联网搜索所需的百度千帆 API Key（bce-v3/... 格式）
; 申请地址：https://console.bce.baidu.com/iam/#/iam/apikey/list
baidu_qianfan_api_key = bce-v3/your-baidu-qianfan-key-here

[MCP]
; 可选：MCP Server 总开关，false 时完全跳过 .mcp.json 的连接尝试
enabled = true
; 工具调用失败后的重试次数（0 表示不重试，失败立即回写错误）
retries = 2
; 线性退避基数（秒）：第 n 次重试前等待 retry_backoff * n
retry_backoff = 1.0
; 单次工具调用超时（秒）
call_timeout = 60
; 建立连接 / list_tools 超时（秒）
connect_timeout = 30

[AGENTS_MD]
; 启动时把项目规则文件作为 system 消息注入会话（一次注入，全程复用，/resume 恢复后保持一致）
enabled = true
; 兼容文件名（逗号分隔，按顺序取第一个存在的）
filenames = AGENTS.md,AGENT.md
; 注入内容长度上限（字符），超出截断并标注
max_chars = 20000

[CONTEXT]
; 上下文用量达到窗口比例后警告并暂停普通输入，直到 /compact 完成
warn_ratio = 0.8
; /compact 摘要目标长度（tokens，写入压缩提示词）
summary_target_tokens = 5000
; 摘要生成的输出上限（tokens）
summary_max_tokens = 8000

[TUI]
; 流式输出刷新间隔（秒）
flush_interval = 0.05

[TOOLS]
; RunCli 单条命令超时（秒）与 stdout/stderr 返回上限（字符）
cli_timeout = 30
cli_max_chars = 4000
; fetchWeb 返回 Markdown 上限（字符）
fetch_max_chars = 8000

