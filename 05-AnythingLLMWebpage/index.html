<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnythingLLM 控制台</title>
<!--
  AnythingLLM Web 控制台（纯前端，无构建步骤）
  结构拆分：index.html（结构）/ styles.css（样式）/ app.js（逻辑）
  安全：API Key 仅在页面运行时输入、保存在内存（可选 sessionStorage），
        绝不写入任何文件；所有接口返回内容一律经 textContent 渲染（防 XSS）。
-->
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>AnythingLLM 控制台</h1>
  <input id="base-url" type="text" placeholder="服务地址 http://localhost:3001">
  <input id="api-key" type="password" placeholder="API Key（运行时输入，不保存到代码）" autocomplete="off">
  <button id="btn-connect">连接</button>
  <span id="conn-status"></span>
</header>

<main>
  <section class="card" id="ws-card">
    <h2>工作区 <span class="mini">点击切换</span></h2>
    <ul id="ws-list"></ul>
    <div id="conn-hint"></div>
  </section>

  <section class="card" id="doc-card">
    <h2>文档 <span class="mini" id="ws-current">未选择工作区</span></h2>
    <ul id="doc-list"></ul>
    <div id="drop-zone">
      <input type="file" id="file-input">
      <button id="btn-upload">上传并向量化</button>
    </div>
    <div id="up-status"></div>
    <div id="doc-status"></div>
  </section>

  <section class="card" id="chat-box">
    <h2>问答</h2>
    <div id="messages"></div>
    <div id="chat-status"></div>
    <div id="ask-row">
      <textarea id="question" rows="2" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
      <button id="btn-ask">发送</button>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
